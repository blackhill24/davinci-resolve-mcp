; Pytest configuration (#119 task 3).
;
; The repo had NO pytest configuration at all, so every collection rule was an
; accident of pytest's defaults. Two of those defaults are load-bearing here and
; are now declared contracts rather than coincidences:
;
;   * `python_files = test_*.py` is what keeps the `live_*.py` harnesses out of an
;     offline run. Those require a running DaVinci Resolve; collecting one on a
;     Resolve-less machine (CI, a fresh clone) fails at import time. The
;     `test_*.py` / `live_*.py` filename split is the repo's convention — see
;     tests/test_live_harness_naming.py, which enforces the other half of it.
;   * `testpaths = tests` stops a bare `pytest` from descending into `.venv/`
;     (numpy, sympy and friends all ship their own conftest.py and tests).
;
; `--strict-markers` makes an unregistered `@pytest.mark.foo` an error instead of a
; silently-ignored typo. There are no markers in use today; register them here as
; they are introduced.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test* *Test *Tests
python_functions = test_*
addopts = --strict-markers --strict-config
norecursedirs = .git .venv node_modules resolve-advanced fixtures __pycache__
markers =
