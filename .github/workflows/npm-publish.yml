name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Run Python smoke tests
        run: python tests/test_import.py

      - name: Run static guard tests
        # Drift guards that gate every publish: no undefined names in src/,
        # tool action lists in sync with dispatch, control-panel guide in
        # sync with the panel's navigation and screenshots, the
        # Blackmagic-facing api-limitations.md in sync with the api_truth ledger,
        # and the tool counts quoted across the docs in sync with reality.
        # #110: two guards moved under tests/<folder>/ in the #52 restructure
        # (test_panel_docs_drift -> tests/dashboard/, test_api_limitations_doc
        # -> tests/core/) but this command kept the flat paths and silently
        # ImportError'd on every publish — the guards were not actually running.
        # #111: test_live_harness_naming added — it keeps live-Resolve harnesses
        # out of test_*.py, which is what makes the pytest step below runnable
        # on a Resolve-less runner at all.
        run: |
          pip install pyflakes
          python -m unittest tests.test_static_undefined_names tests.test_action_list_drift tests.dashboard.test_panel_docs_drift tests.core.test_api_limitations_doc tests.test_doc_tool_counts tests.test_live_harness_naming

      - name: Run full Python offline test suite
        # #110 finding (packaging): the publish workflow used to run only a
        # smoke + a handful of drift guards — never `pytest tests/` (~2060
        # offline tests). A behavior regression in src/ could ship to npm
        # untested. Install the same dependency set install.py provisions
        # (mcp[cli] + requirements.txt) and run the offline suite.
        #
        # #111 finding 1: this step had NEVER completed on CI. The comment here
        # used to claim "live_* tests skip themselves without a running Resolve,
        # so this is the same green baseline the repo reports" — wrong on both
        # counts. pytest does not collect live_*.py at all (its default globs are
        # test_*.py / *_test.py), and the two live harnesses that mattered were
        # misnamed test_live_api.py / test_resolve20_api.py. Both did a
        # module-level `import DaVinciResolveScript`, which raises
        # ModuleNotFoundError on ubuntu-latest, so collection aborted with exit 2
        # and publish never reached the ruff / Node / smoke steps below.
        # Both are now live_api_probe.py / live_resolve20_api.py and are not
        # collected; tests.test_live_harness_naming above keeps it that way.
        run: |
          pip install "mcp[cli]" -r requirements.txt pytest
          python -m pytest tests/ -q

      - name: Lint with ruff
        # #110 finding (packaging): ruff was enforced by nothing automated —
        # no CI step, no test. The lint gate is real (ruff.toml defines a
        # narrow, defect-only rule set) but invisible until a human ran it.
        run: |
          pip install ruff
          ruff check src scripts tests

      - name: Run Resolve-advanced Node test suite
        # #110 finding (packaging): the publish workflow ran neither test
        # suite. The advanced server's vendor codecs (drp-format /
        # drt-format / drx-codec) are pure-JS and self-contained — a codec
        # regression that corrupts .drp files would ship untested. The Node
        # suite is the gate that catches it.
        run: |
          npm install --prefix resolve-advanced
          npm test --prefix resolve-advanced

      - name: Run Node CLI smoke tests
        run: |
          node bin/davinci-resolve-mcp.mjs --help
          node bin/davinci-resolve-mcp.mjs --version

      - name: Run setup dry run
        run: |
          export DAVINCI_RESOLVE_MCP_INSTALL_ROOT="$(mktemp -d)"
          node bin/davinci-resolve-mcp.mjs setup --dry-run --no-venv --clients manual --update-policy never

      - name: Check npm package contents
        run: npm pack --dry-run

      - name: Check npm version availability
        id: npm_version
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published; skipping npm publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is not published yet."
          fi

      - name: Compute expected tarball checksum
        id: pack_meta
        if: steps.npm_version.outputs.publish == 'true'
        shell: bash
        run: |
          shasum="$(npm pack --dry-run --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].shasum")"
          echo "shasum=${shasum}" >> "$GITHUB_OUTPUT"
          echo "Expected tarball shasum: ${shasum}"

      - name: Publish to npm
        id: npm_publish
        if: steps.npm_version.outputs.publish == 'true'
        continue-on-error: true
        run: npm publish --provenance --access public

      - name: Verify publish landed
        if: steps.npm_version.outputs.publish == 'true' && steps.npm_publish.outcome == 'failure'
        shell: bash
        run: |
          # npm publish can exit nonzero after the registry has already accepted
          # the PUT: a retried request re-presents the consumed single-use OIDC
          # exchange token and gets 401 "token is invalid" (observed on the
          # v2.37.0 run). Only fail the job if the exact tarball is not live.
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          expected="${{ steps.pack_meta.outputs.shasum }}"
          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "${package_name}@${package_version}" dist.shasum 2>/dev/null || true)"
            if [ -n "${published}" ]; then
              if [ "${published}" = "${expected}" ]; then
                echo "npm publish reported failure, but ${package_name}@${package_version} is live with the expected shasum ${expected}. Treating as success."
                exit 0
              fi
              echo "::error::${package_name}@${package_version} exists on the registry with shasum ${published}, expected ${expected}. Refusing to mask the publish failure."
              exit 1
            fi
            echo "Attempt ${attempt}: ${package_name}@${package_version} not visible on the registry yet; retrying in 10s."
            sleep 10
          done
          echo "::error::npm publish failed and ${package_name}@${package_version} never appeared on the registry."
          exit 1
